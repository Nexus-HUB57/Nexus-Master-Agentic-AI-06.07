kind = "web"
previewPath = "/"
title = "Nexus Agentic Hub"
version = "1.0.0"
id = "artifacts/nexus-agentic-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25764

[services.development]
run = "pnpm --filter @workspace/nexus-agentic-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexus-agentic-hub", "run", "build" ]
publicDir = "artifacts/nexus-agentic-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25764"
BASE_PATH = "/"
